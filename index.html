<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Do you love me?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --plum-deep: #241329;
    --plum-mid: #3a1f42;
    --pink-glow: #ff6f9c;
    --pink-soft: #ffb3c6;
    --gold: #ffc857;
    --cream: #fff3e8;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background: radial-gradient(circle at 50% 20%, var(--plum-mid) 0%, var(--plum-deep) 70%);
    font-family: 'Quicksand', sans-serif;
  }

  .stage{
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .heart{
    position: absolute;
    bottom: -10vh;
    color: var(--pink-glow);
    opacity: 0.25;
    animation: floatUp linear infinite;
    pointer-events: none;
    user-select: none;
  }

  @keyframes floatUp{
    0%   { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
    10%  { opacity: 0.3; }
    90%  { opacity: 0.2; }
    100% { transform: translateY(-115vh) translateX(var(--drift, 20px)) rotate(360deg); opacity: 0; }
  }

  .question{
    font-family: 'Dancing Script', cursive;
    font-weight: 700;
    color: var(--cream);
    font-size: clamp(2.4rem, 8vw, 5rem);
    text-shadow: 0 0 30px rgba(255, 111, 156, 0.45);
    margin: 0 0 1.5rem 0;
    padding: 0 1rem;
    z-index: 2;
    animation: gentlePulse 3.5s ease-in-out infinite;
  }

  @keyframes gentlePulse{
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.03); }
  }

  .tease-text{
    position: fixed;
    top: 22%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    font-size: clamp(1.1rem, 3.5vw, 1.7rem);
    color: var(--plum-deep);
    background: linear-gradient(135deg, var(--cream), var(--pink-soft));
    padding: 0.7rem 1.6rem;
    border-radius: 999px;
    box-shadow: 0 8px 22px rgba(0,0,0,0.35);
    opacity: 0;
    z-index: 5;
    white-space: nowrap;
    pointer-events: none;
  }

  .tease-text.show{
    animation: popIn 0.5s ease forwards;
  }

  @keyframes popIn{
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
    15%  { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
    25%  { transform: translate(-50%, -50%) scale(1); }
    80%  { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(0.95); }
  }

  .btn-row{
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 28px;
  }

  button{
    border: none;
    border-radius: 999px;
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  #yesBtn{
    background: linear-gradient(135deg, var(--gold), var(--pink-glow));
    color: var(--plum-deep);
    padding: 1rem 2.6rem;
    font-size: clamp(1.1rem, 2.5vw, 1.6rem);
    box-shadow: 0 8px 25px rgba(255, 111, 156, 0.5);
  }

  #yesBtn:hover{
    transform: scale(1.06);
    box-shadow: 0 10px 32px rgba(255, 111, 156, 0.7);
  }

  #noBtn{
    background: transparent;
    color: var(--pink-soft);
    border: 2px solid var(--pink-soft);
    padding: 1rem 2.2rem;
    font-size: clamp(1.1rem, 2.5vw, 1.6rem);
  }

  .final-line{
    position: fixed;
    top: 32%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: 'Dancing Script', cursive;
    color: var(--gold);
    font-size: clamp(1.3rem, 4vw, 2rem);
    opacity: 0;
    z-index: 5;
    pointer-events: none;
    text-shadow: 0 0 20px rgba(255,200,87,0.5);
  }

  .final-line.show{
    animation: fadeHold 3s ease forwards;
  }

  @keyframes fadeHold{
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
    15%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    85%  { opacity: 1; }
    100% { opacity: 0; }
  }

  .celebration{
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
    background: radial-gradient(circle at 50% 30%, var(--plum-mid), var(--plum-deep));
    z-index: 10;
  }

  .celebration.show{ display: flex; }

  .celebration h1{
    font-family: 'Dancing Script', cursive;
    color: var(--gold);
    font-size: clamp(2.2rem, 7vw, 4.5rem);
    text-shadow: 0 0 30px rgba(255, 200, 87, 0.5);
    margin: 0 0 1rem 0;
  }

  .celebration p{
    color: var(--cream);
    font-size: 1.1rem;
    opacity: 0.85;
    max-width: 500px;
    padding: 0 1.5rem;
  }

  .burst{
    position: absolute;
    font-size: 1.8rem;
    animation: burstOut 1.4s ease-out forwards;
    pointer-events: none;
  }

  @keyframes burstOut{
    0%   { transform: translate(0,0) scale(0.6); opacity: 1; }
    100% { transform: translate(var(--bx), var(--by)) scale(1.3); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce){
    .heart{ animation: none; opacity: 0; }
    .question{ animation: none; }
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <h1 class="question">Do you love me? 🥰</h1>

  <div class="tease-text" id="teaseText"></div>
  <div class="final-line" id="finalLine">Only YES is left now 😌💛</div>

  <div class="btn-row">
    <button id="yesBtn" onclick="sayYes()">YES 💛</button>
    <button id="noBtn" onclick="dodgeNo()">NO</button>
  </div>
</div>

<div class="celebration" id="celebration">
  <h1>She said YES! 🎉</h1>
  <p>I knew it. Page 2 is coming soon — this is just where it'll take you next.</p>
</div>

<script>
  const stage = document.getElementById('stage');
  const heartSymbols = ['♥','❤','💕'];
  for(let i=0;i<18;i++){
    const h = document.createElement('div');
    h.className = 'heart';
    h.textContent = heartSymbols[Math.floor(Math.random()*heartSymbols.length)];
    h.style.left = Math.random()*100 + 'vw';
    h.style.fontSize = (14 + Math.random()*22) + 'px';
    h.style.setProperty('--drift', (Math.random()*80 - 40) + 'px');
    h.style.animationDuration = (8 + Math.random()*10) + 's';
    h.style.animationDelay = (Math.random()*10) + 's';
    stage.appendChild(h);
  }

  const yesBtn = document.getElementById('yesBtn');
  const noBtn = document.getElementById('noBtn');
  const teaseText = document.getElementById('teaseText');
  const finalLine = document.getElementById('finalLine');

  const messages = [
    "Stop lying 😭",
    "Seriously?! 🙄",
    "Don't do this 🥺",
    "Still no?! 😤",
    "You're so bad 💔",
    "Have some pity on me… 🥹"
  ];

  let dodgeCount = 0;
  const maxDodges = 6;

  function dodgeNo(){
    if(dodgeCount >= maxDodges) return;
    dodgeCount++;

    // Show the callout text
    teaseText.textContent = messages[dodgeCount - 1];
    teaseText.classList.remove('show');
    void teaseText.offsetWidth; // restart animation
    teaseText.classList.add('show');

    // Switch NO to free-roaming positioning on its first click
    if(dodgeCount === 1){
      const rect = noBtn.getBoundingClientRect();
      noBtn.style.position = 'fixed';
      noBtn.style.left = rect.left + 'px';
      noBtn.style.top = rect.top + 'px';
      noBtn.style.margin = '0';
    }

    const scale = Math.max(1 - dodgeCount * 0.13, 0.15);
    const btnW = noBtn.offsetWidth || 120;
    const btnH = noBtn.offsetHeight || 50;
    const padding = 24;
    const maxX = window.innerWidth - btnW - padding;
    const maxY = window.innerHeight - btnH - padding;
    const newX = padding + Math.random() * Math.max(maxX - padding, 0);
    const newY = padding + Math.random() * Math.max(maxY - padding, 0);

    noBtn.style.transition = 'left 0.35s ease, top 0.35s ease, transform 0.35s ease, opacity 0.5s ease';
    noBtn.style.left = newX + 'px';
    noBtn.style.top = newY + 'px';
    noBtn.style.transform = `scale(${scale})`;

    const yesScale = Math.min(1 + dodgeCount * 0.14, 2.4);
    yesBtn.style.transition = 'transform 0.35s ease';
    yesBtn.style.transform = `scale(${yesScale})`;

    if(dodgeCount >= maxDodges){
      noBtn.style.opacity = '0';
      noBtn.style.pointerEvents = 'none';
      setTimeout(()=>{
        finalLine.classList.remove('show');
        void finalLine.offsetWidth;
        finalLine.classList.add('show');
      }, 600);
    }
  }

  function sayYes(){
    for(let i=0;i<16;i++){
      const b = document.createElement('div');
      b.className = 'burst';
      b.textContent = ['💛','💕','✨','🎉'][Math.floor(Math.random()*4)];
      const rect = yesBtn.getBoundingClientRect();
      b.style.left = rect.left + rect.width/2 + 'px';
      b.style.top = rect.top + rect.height/2 + 'px';
      const angle = Math.random()*Math.PI*2;
      const dist = 100 + Math.random()*150;
      b.style.setProperty('--bx', Math.cos(angle)*dist + 'px');
      b.style.setProperty('--by', Math.sin(angle)*dist + 'px');
      document.body.appendChild(b);
      setTimeout(()=>b.remove(), 1400);
    }

    setTimeout(()=>{
      document.getElementById('celebration').classList.add('show');
      setTimeout(()=>{
        window.location.href = "page2.html";
      }, 1800);
    }, 500);
  }
</script>

</body>
</html>
